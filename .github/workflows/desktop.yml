# 데스크톱 클라이언트 설치 파일을 OS별로 빌드한다.
# desktop-v* 태그를 올리면 GitHub Release 를 만들어 설치 파일을 붙인다(다운로드 페이지가 이 파일을 내려준다).
# 수동 실행(workflow_dispatch)은 빌드만 하고 결과를 Actions 아티팩트로 남긴다.
# 접속할 서버 주소는 저장소 변수 NADRI_SERVER_URL 로 바꿀 수 있다(없으면 https://nadri.live).
name: desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10
  NADRI_SERVER_URL: ${{ vars.NADRI_SERVER_URL }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package: dmg
            asset: nadri-macos-arm64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            package: dmg
            asset: nadri-macos-x64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: nsis
            asset: nadri-windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Dioxus CLI
        shell: bash
        run: cargo binstall -y --force "dioxus-cli@$DX_VERSION"

      - name: 테스트
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test -p desktop

      - name: 설치 파일 빌드
        shell: bash
        working-directory: desktop
        run: dx bundle --platform desktop --release --target ${{ matrix.target }} --package-types ${{ matrix.package }}

      - name: 이름 정리
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            dmg) file=$(find target/dx/nadri/bundle -name '*.dmg' | grep -i "$(echo ${{ matrix.target }} | cut -d- -f1)" | head -1) ;;
            nsis) file=$(find target/dx/nadri/bundle -name '*-setup.exe' | head -1) ;;
          esac
          test -n "$file" || { echo "설치 파일을 찾지 못했습니다"; find target/dx/nadri/bundle; exit 1; }
          mkdir -p dist && cp "$file" "dist/${{ matrix.asset }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        run: |
          (cd dist && sha256sum nadri-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "나드리 데스크톱 ${GITHUB_REF_NAME#desktop-}" \
            --notes "macOS(Apple Silicon·Intel)와 Windows(x64) 설치 파일입니다. 설치 방법은 ${SERVICE_URL}/download/ 를 보세요."
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_URL: ${{ vars.NADRI_SERVER_URL || 'https://nadri.live' }}
