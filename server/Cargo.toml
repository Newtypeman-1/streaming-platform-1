[package]
name = "server"
edition.workspace = true
version.workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
thiserror = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
http-body-util = "0.1"
