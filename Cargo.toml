[workspace]
resolver = "3"
members = ["server", "shared", "web", "desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 비밀번호 해시(Argon2)는 디버그 빌드에서 너무 느려 테스트·개발 서버가 굼떠진다
[profile.dev.package.argon2]
opt-level = 3
