[package]
name = "web"
edition.workspace = true
version.workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
dioxus = { version = "0.7", features = ["web", "router"] }
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlInputElement", "FileList", "File", "Blob", "FormData", "UrlSearchParams"] }
gloo-timers = { version = "0.4.1", features = ["futures"] }
